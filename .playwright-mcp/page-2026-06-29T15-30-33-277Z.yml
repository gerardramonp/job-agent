                - paragraph [ref=e1449]:
                  - generic [ref=e1450]:
                    - text: ALTEN es una multinacional europea especializada en proporcionar servicios de consultoría, tecnologías de la información y servicios de ingeniería a las principales compañías del mercado español.
                    - text: "Con una cifra de negocio a nivel mundial de 4.100 millones de euros, cuenta con una plantilla de 57.700 profesionales y está presente en más de 30 países. Nuestra capacidad para desarrollar y adaptarnos a los requisitos del mercado facilita nuestra presencia en diferentes sectores de la economía y la industria. En ALTEN nos especializamos en la prestación de servicios para crear soluciones de negocios con tecnologías estándar, desde la conceptualización y el diseño inicial hasta la implementación o el mantenimiento final. Ofrecemos a nuestros clientes una cobertura geográfica total, gracias a nuestras ocho sedes: Madrid, Barcelona, Valladolid, Pamplona, Cádiz, Sevilla, Murcia, Málaga y Vigo. La gama de servicios de ALTEN se basa en un concepto fundamental, su capacidad para satisfacer las necesidades operativas a través de la tecnología más adecuada para cada caso. El equipo de ALTEN en España, con más de 5.500 profesionales, ofrece la experiencia de miles de horas de investigación tecnológica tanto en ingeniería como en IT. Utilizamos las últimas tecnologías en una cultura corporativa de excelencia, ofreciendo una cobertura total a nuestros clientes."
