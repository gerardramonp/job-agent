                  - heading "About the job" [level=2] [ref=e378]
                  - paragraph [ref=e947]:
                    - paragraph [ref=e949]:
                      - strong [ref=e951]: Queue Lead – Spain (12-Month Initial Fixed-Term Contract)
                    - paragraph [ref=e953]:
                      - strong [ref=e955]: "Location:"
                      - text: Spain (Fully Remote)
                    - paragraph [ref=e957]:
                      - strong [ref=e959]: "Salary:"
                      - text: €40,000 - €48,000 per annum
                    - paragraph [ref=e961]
                    - paragraph [ref=e963]:
                      - strong [ref=e965]: Company Overview
                    - paragraph [ref=e967]: 83zero is recruiting on behalf of an innovative global technology organisation that develops market-leading cloud security solutions. This is an exciting opportunity to join a high-performing international support team, working alongside colleagues across Europe and beyond.
                    - paragraph [ref=e969]
                    - paragraph [ref=e971]:
                      - strong [ref=e973]: Role Overview
                    - paragraph [ref=e975]: We are looking for a proactive Queue Lead to join on an initial 12-month fixed-term contract (with a strong possibility of extension), supporting the day-to-day operations of a global Cloud Security Technical Support organisation.
                    - paragraph [ref=e977]: As the Queue Lead, you will be responsible for ensuring the smooth flow of support cases across the business, preventing bottlenecks, managing case routing, and ensuring work is prioritised effectively to meet service level agreements. You'll act as the central point of coordination between multiple internal teams, helping to keep support operations running efficiently across global regions.
                    - paragraph [ref=e979]
                    - paragraph [ref=e981]: This is a fast-paced, highly collaborative role that requires excellent organisational skills, strong time management, and the confidence to communicate with a wide range of stakeholders throughout the day. You will need to be proactive, detail-oriented, and comfortable taking ownership to ensure support cases continue moving through the queue without delays.
                    - paragraph [ref=e983]
                    - paragraph [ref=e985]:
                      - strong [ref=e987]: Key Responsibilities
                    - list [ref=e989]:
                      - listitem [ref=e990]: Manage the day-to-day support queues for a portfolio of cloud security products, ensuring cases progress without delays or operational blockers.
                      - listitem [ref=e991]: Monitor, prioritise, assign, and route support cases in line with SLA targets.
                      - listitem [ref=e992]: Coordinate queue management activities, including case routing, ownership validation, First Time Support (FTS), reopen handling, and queue hygiene.
                      - listitem [ref=e993]: Identify and resolve duplicate, missing, or misrouted cases.
                      - listitem [ref=e994]: Work closely with Technical Support, Engineering, Customer Success, and Account teams across multiple regions, including Spain, Israel, Poland, and India.
