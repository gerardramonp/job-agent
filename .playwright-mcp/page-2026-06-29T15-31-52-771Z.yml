                  - generic [ref=e399]:
                    - heading "About the job" [level=2] [ref=e401]
                    - paragraph [ref=e402]:
                      - generic [ref=e403]:
                        - paragraph [ref=e404]: On Rent es una empresa líder en el sector de renting flexible, proporcionando soluciones de transporte eficientes, flexibles y a medida para empresas de diferentes sectores. Con una flota de 5.000 vehículos, hemos crecido para convertirnos en un referente en el mercado, ofreciendo una flota moderna y diversa, así como un servicio al cliente excepcional.
                        - paragraph [ref=e405]: Nos especializamos en el alquiler de vehículos industriales para empresas que buscan optimizar sus operaciones logísticas sin comprometer la calidad o la rentabilidad. Nuestro enfoque está basado en la innovación, la sostenibilidad y la adaptabilidad, brindando a nuestros clientes las herramientas que necesitan para maximizar su eficiencia operativa.
                        - paragraph [ref=e406]
                        - paragraph [ref=e407]: Actualmente nos encontramos en búsqueda de un Técnico/a de Calidad y Sistema Integrado de Gestión junior.
                        - paragraph [ref=e408]
                        - paragraph [ref=e409]: "Tus principales funciones serán:"
                        - paragraph [ref=e410]
                        - paragraph [ref=e411]: · Definición, desarrollo e implantación del Sistema Integrado de Gestión de la compañía (calidad, medio ambiente, seguridad y otros estándares aplicables).
                        - paragraph [ref=e412]: · Diseñar y estructurar los procesos operativos y de soporte, asegurando su alineación con el modelo de negocio de Onrent.
                        - paragraph [ref=e413]: · Elaborar, actualizar y mantener la documentación del sistema (procedimientos, políticas, instrucciones, etc.).
                        - paragraph [ref=e414]: · Definir y hacer seguimiento de los KPIs operativos y de calidad, impulsando la toma de decisiones basada en datos.
                        - paragraph [ref=e415]: · Coordinar y ejecutar auditorías internas y dar soporte en auditorías externas (ISO u otros estándares).
                        - paragraph [ref=e416]: · Asegurar el cumplimiento de requisitos normativos, contractuales y de cliente.
                        - paragraph [ref=e417]: · Actuar como nexo entre áreas (operaciones, comercial, financiera, etc.) para garantizar la coherencia del modelo de gestión.
                        - paragraph [ref=e418]: · Participar en proyectos transversales de transformación y crecimiento de la compañía.
                        - paragraph [ref=e419]
                        - paragraph [ref=e420]
                        - paragraph [ref=e421]: "Requisitos:"
                        - paragraph [ref=e422]: · Experiencia en calidad y sistemas de gestión, preferiblemente en entornos de servicios, renting, movilidad o sectores afines de al menos 1 año
                        - paragraph [ref=e423]: · Experiencia previa en implantación o gestión de sistemas integrados (ISO 9001, ISO 14001, ISO 45001 u otros).
                        - paragraph [ref=e424]: · Valorable experiencia en compañías de renting, movilidad o servicios operativos.
                        - paragraph [ref=e425]: · Capacidad para estructurar procesos desde cero y llevarlos a operación real.
                        - paragraph [ref=e426]: · Perfil con visión transversal, capaz de interactuar con múltiples áreas de la compañía.
                        - paragraph [ref=e427]: · Alta capacidad analítica y orientación a datos e indicadores.
                        - paragraph [ref=e428]: · Dominio de herramientas ofimáticas (especialmente Excel).
                        - paragraph [ref=e429]: · Orientación a resultados, autonomía y capacidad de ejecución.
                        - paragraph [ref=e430]: · Mentalidad de mejora continua y resolución de problemas.
                        - paragraph [ref=e431]
                        - paragraph [ref=e432]: ¿Qué te ofrecemos en Onrent?
                        - paragraph [ref=e433]: "· Proyecto en crecimiento: formarás parte de una compañía en fase de desarrollo, con impacto directo en el modelo de negocio."
                        - paragraph [ref=e434]: "· Rol estratégico y transversal: no es un puesto operativo, es un rol de construcción y transformación."
                        - paragraph [ref=e435]: "· Autonomía y responsabilidad: tendrás capacidad real de definir e implementar."
                        - paragraph [ref=e436]: "· Entorno dinámico: trabajarás con distintos equipos y áreas, con visión global del negocio."
                        - paragraph [ref=e437]: "· Desarrollo profesional: crecimiento ligado a la evolución del área y de la compañía."
                        - paragraph [ref=e438]
                        - paragraph [ref=e439]: ¡Te estamos esperando!
                        - paragraph [ref=e440]
