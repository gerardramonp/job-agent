# Canned answers used to auto-fill common application questions.
# The apply-assist bot uses ONLY these facts (it will not invent anything).

workEligibility:
  # Are you authorized to work in Spain? true | false
  authorizedToWorkInSpain: true
  # Do you need visa sponsorship? true | false
  needsVisaSponsorship: false
  # Free-text nationality/status if a form asks (e.g. "EU citizen"). Optional.
  statusNote: ""

compensation:
  # Gross annual salary in EUR. Use null if you prefer "negotiable".
  minEurGross: 22000
  desiredEurGross: 23000
  # Shown when a form forces a text answer (e.g. "Negotiable, open to discuss")
  note: ""

languages:
  # When a form asks specifically for B2 or higher English, answer Yes.
  englishB2OrHigher: true

availability:
  # Notice period (e.g. "Immediate", "15 days", "1 month")
  noticePeriod: "15 days"
  # Earliest start date (YYYY-MM-DD) or free text
  earliestStartDate: ""

coverLetter:
  # Tone: concise | formal | friendly
  tone: "formal"
  # A short default pitch (2-3 sentences) about why you fit QA roles
  shortPitch: "Frontend Developer transitioning into QA, with Agile experience and hands-on testing across the development cycle. My technical background helps me understand how products are built and communicate issues with precision, while my QA focus drives me to identify risks and uncover edge cases. I also apply AI-assisted workflows to improve test design, exploratory testing, and risk analysis."

extras:
  # Optional. Leave blank to skip.
  drivingLicense: "B"
  # Diversity/demographic answers if you choose to provide them
  notes: ""
